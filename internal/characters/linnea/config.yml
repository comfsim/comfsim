use: pipeline
kind: character
name: linnea

talents:
  - attack:
    - attack(1-Hit DMG)
    - attack(2-Hit DMG)
    - attack(3-Hit DMG)
  - aim: attack(Aimed Shot)
  - fullaim: attack(Fully-Charged Aimed Shot)
  - collision: attack(Plunge DMG)
  - lowPlunge: attack(Low/High Plunge DMG)
  - highPlunge: attack(Low/High Plunge DMG|1)

  - skillPound: skill(Lumi Pound-Pound Pummeler DMG)
  - skillHeavy: skill(Lumi Heavy Overdrive Hammer DMG)
  - skillMillion: skill(Lumi Million Ton Crush DMG)

  - burstInitialFlat: burst(Initial Healing Amount|1)
  - burstInitialDef: burst(Initial Healing Amount)
  - burstTickFlat: burst(Continuous Healing|1)
  - burstTickDef: burst(Continuous Healing)

docs:
  issues:
    - "Lumi's position is approximated by the current primary target's position. Lumi's movement and vertical range are not modeled."
    - "C1 currently consumes stacks once per hit across all targets and Lunar-Crystallize contributors. Multi-target consumption still needs in-game verification."
    - "Existing action frames are retained. Burst CanQueueAfter is 97 frames, but its Skill cancel is 96 frames; the frame consistency test currently fails."
    - "Burst is modeled with 12 healing ticks at 1-second intervals. The final tick at the duration boundary still needs verification."
  frames:
    - count: https://docs.google.com/spreadsheets/d/1JBfw7ObsV8QXKiOEsrkeTcc36yChs9azBST5514U5uI/
      count_credit: caramielle.
      video: https://youtu.be/EczNMc6Q3R4
      video_credit: caramielle.
    - count: https://docs.google.com/spreadsheets/d/1JBfw7ObsV8QXKiOEsrkeTcc36yChs9azBST5514U5uI/
      count_credit: caramielle.
      video: https://youtu.be/CdDFKsKmRz0
      video_credit: caramielle.

abilities:
  - name: attack
    params:
      travel: Projectile travel time. Default 10 frames.

  - name: aim
    params:
      hold: 0 for Physical Aimed Shot, 1 for Fully-Charged Aimed Shot.
      travel: Projectile travel time. Default 10 frames.
      weakspot: Hit the weakspot with the aimed shot. Default 0 (false), 1 for true.

  - name: skill
    params:
      recast: Recast the skill while its recast window is active.
    note: "Repeated Skill casts during the recast window feed Lumi. The initial cast followed by three recasts triggers Million Ton Crush."

  - name: burst
    note: "The initial heal affects the whole party. Subsequent heals affect the active character. Casting Burst while Lumi is present refreshes her duration and preserves her form and attack sequence."

  - name: a1
    hitbox:
      - name: A1-Geo-RES-Shred
        shape: Circle
        center: PrimaryTarget
        radius: 10
        note: "Lumi is approximated at the primary target. The assumed 10-unit height is not modeled in the 2D combat plane."

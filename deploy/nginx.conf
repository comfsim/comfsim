server {  
    listen 8080;  
    root /usr/share/nginx/html;  

    location /api/wasm/ {  
        rewrite ^/api/wasm/.*$ /main.wasm last;  
    } 

    location /api/ {  
        proxy_pass http://127.0.0.1:54321/;  
        proxy_set_header Host $host;  
    }  
  
    location / {  
        try_files $uri $uri/ /index.html;  # SPA fallback for tanstack router  
    }  
}

app = "comfsim-server-comf"
primary_region = "fra"

[build]
  dockerfile = "server.Dockerfile"

[build.args]
  GO_VERSION="1.27"
  NODE_VERSION="26"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpus = 1
  memory_mb = 1024
